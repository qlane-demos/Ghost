server {
  listen 2368;
  # nginx's entrypoint only injects an IPv6 listener when default.conf matches
  # the packaged version; ours does not, so it is skipped. Alpine's musl
  # resolves `localhost` to ::1 FIRST and busybox wget does not fall back to
  # IPv4, so an IPv4-only listener makes every localhost probe report
  # "connection refused" while nginx is perfectly healthy.
  listen [::]:2368;
  server_name _;

  # Self-contained liveness for this container's own healthcheck. It must NOT
  # proxy: a probe that goes through to Ghost inherits Ghost's response
  # semantics -- a redirect busybox wget chases to an unreachable external host
  # fails the check forever, which is what stopped the previous run before the
  # preview step could test the proxy at all. Whether proxying works is the
  # preview step's job, not this one's.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://ghost-app:2368;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # The header the sandbox edge does not send, and the whole reason this
    # proxy exists. Without it Ghost 301s an https canonical URL back to
    # itself, forever.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
